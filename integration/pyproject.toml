[project]
name = "risk-sentinel-integration"
version = "0.1.0"
description = "Integration and parity tests for Risk Sentinel."
requires-python = ">=3.13"

dependencies = [
    "confluent-kafka>=2.15.0",
    "pyarrow>=25.0.1",
    "risk-engine",
    "risk-features",
    "risk-persistence",
]

[tool.uv.sources]
risk-engine = { path = "../risk_engine", editable = true }
risk-features = { path = "../features", editable = true }
risk-persistence = { path = "../persistence", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_integration"]
