[project]
name = "risk-ml"
version = "0.1.0"
description = "Training and evaluation pipeline for Risk Sentinel."
requires-python = ">=3.13"

dependencies = [
    "catboost>=1.2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "risk-engine",
    "lightgbm>=4.7.0",
    "xgboost>=3.4.1",
]

[tool.uv.sources]
risk-engine = { path = "../risk_engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_ml"]
