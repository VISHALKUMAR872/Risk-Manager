[project]
name = "risk-stream-worker"
version = "0.1.0"
description = "Redpanda transaction event stream worker for Risk Sentinel."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "confluent-kafka>=2.12.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "risk-engine",
    "risk-persistence",
    "risk-features",
    "prometheus-client>=0.22.0",
]

[tool.uv.sources]
risk-engine = { path = "../../risk_engine", editable = true }
risk-persistence = { path = "../../persistence", editable = true }
risk-features = { path = "../../features", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_stream"]
