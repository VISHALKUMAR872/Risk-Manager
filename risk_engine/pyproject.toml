[project]
name = "risk-engine"
version = "0.1.0"
description = "Shared Risk Sentinel domain contracts and risk engine."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "catboost>=1.2.10",
    "joblib>=1.5.0",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_engine"]
