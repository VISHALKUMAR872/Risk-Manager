[project]
name = "risk-persistence"
version = "0.1.0"
description = "Shared PostgreSQL, Redis and Neo4j persistence adapters for Risk Sentinel."
requires-python = ">=3.13"

dependencies = [
    "neo4j>=6.2.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "risk-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/risk_persistence"]

[tool.uv.sources]
risk-engine = { path = "../risk_engine", editable = true }