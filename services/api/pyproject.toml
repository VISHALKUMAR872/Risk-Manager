[project]
name = "risk-sentinel-api"
version = "0.1.0"
description = "FastAPI decision and API layer for Risk Sentinel."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "risk-engine",
    "risk-persistence",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
risk-engine = { path = "../../risk_engine", editable = true }
risk-persistence = { path = "../../persistence", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_api"]
